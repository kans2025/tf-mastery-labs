on:name: terraform
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write          # lets the auth step get Google credentials (Workload Identity Federation)

env:
  WORKDIR: environments/dev   # every Terraform step runs here; ../../policy/ is relative to it

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4       # copies the repo at the commit that triggered the run
      - uses: hashicorp/setup-terraform@v3
      # Authenticate to Google here, for example google-github-actions/auth
      # with Workload Identity Federation (preferred) or a service account key secret.
      - name: Install Conftest
        run: |
          V=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest | grep tag_name | cut -d '"' -f4 | cut -c2-)
          curl -sL "https://github.com/open-policy-agent/conftest/releases/download/v${V}/conftest_${V}_Linux_x86_64.tar.gz" | tar xz conftest
          sudo mv conftest /usr/local/bin/
      - run: terraform init           # connects to the same remote GCS state as your laptop
      - run: terraform plan -out=tfplan.binary
      - run: terraform show -json tfplan.binary > tfplan.json
      - run: conftest test tfplan.json -p ../../policy/ --all-namespaces
      - name: Comment the plan on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const out = execSync('terraform show -no-color tfplan.binary', { cwd: process.env.WORKDIR }).toString();
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '```\n' + out.slice(0, 60000) + '\n```'
            });

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      # Same authentication step as the plan job.
      # Install Conftest as in the plan job.
      - run: terraform init           # connects to the same remote GCS state as your laptop
      - run: terraform plan -out=tfplan.binary
      - run: terraform show -json tfplan.binary > tfplan.json
      - run: conftest test tfplan.json -p ../../policy/ --all-namespaces
      - run: terraform apply -auto-approve tfplan.binary