name: terraform

on:
  schedule:                   # scheduled runs always use the workflow file on main
    - cron: '0 6 * * *'   # nightly, 06:00 UTC
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  WORKDIR: environments/dev

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/861076661553/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: terraform-gha@project-d263020c-723a-485a-adc.iam.gserviceaccount.com
      - name: Install Conftest
        run: |
          V=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest | grep tag_name | cut -d '"' -f4 | cut -c2-)
          curl -sL "https://github.com/open-policy-agent/conftest/releases/download/v${V}/conftest_${V}_Linux_x86_64.tar.gz" | tar xz conftest
          sudo mv conftest /usr/local/bin/
      - run: terraform init
      - run: terraform plan -lock-timeout=120s -out=tfplan.binary
      - run: terraform show -json tfplan.binary > tfplan.json
      - run: conftest test tfplan.json -p ../../policy/ --all-namespaces
      - name: Comment the plan on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const out = execSync('terraform show -no-color tfplan.binary', { cwd: process.env.WORKDIR }).toString();
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '```\n' + out.slice(0, 60000) + '\n```'
            });

  apply:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/861076661553/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: terraform-gha@project-d263020c-723a-485a-adc.iam.gserviceaccount.com
      - name: Install Conftest
        run: |
          V=$(curl -s https://api.github.com/repos/open-policy-agent/conftest/releases/latest | grep tag_name | cut -d '"' -f4 | cut -c2-)
          curl -sL "https://github.com/open-policy-agent/conftest/releases/download/v${V}/conftest_${V}_Linux_x86_64.tar.gz" | tar xz conftest
          sudo mv conftest /usr/local/bin/
      - run: terraform init
      - run: terraform plan -lock-timeout=120s -out=tfplan.binary
      - run: terraform show -json tfplan.binary > tfplan.json
      - run: conftest test tfplan.json -p ../../policy/ --all-namespaces
      - run: terraform apply -auto-approve tfplan.binary
  drift-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: google-github-actions/auth@v2   # same values as in Exercise 3
        with:
          workload_identity_provider: projects/861076661553/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: terraform-gha@project-d263020c-723a-485a-adc.iam.gserviceaccount.com
      - run: terraform init
      # refreshes from GCP and compares with the code on main: exit 0 = no drift, 2 = drift, 1 = error
      - run: terraform plan -detailed-exitcode || echo "::warning::drift detected"
  ai-review:
    if: github.event_name == 'pull_request'    # pull requests only, like the plan job
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev    # same folder as the plan job
    
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false             # keeps tfplan.json clean, same as plan
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/861076661553/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: terraform-gha@project-d263020c-723a-485a-adc.iam.gserviceaccount.com
      - run: terraform init
      - run: terraform plan -lock-timeout=120s -out=tfplan.binary
      - run: terraform show -json tfplan.binary > tfplan.json
      # review/ is at the repo root, two levels up from environments/dev
      - name: AI review
        run: |
          pip install --quiet google-auth requests
          python ../../review/ai_review.py --prompt ../../review/review-prompt.txt --input tfplan.json > review-output.txt
          cat review-output.txt
          if grep -q "^VERDICT: CRITICAL" review-output.txt; then
            echo "::error::AI review found a CRITICAL issue"
            exit 1
          fi